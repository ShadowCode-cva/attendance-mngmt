<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | EduSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="staff.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div class="background-overlay"></div>
    
    <div class="admin-wrapper">
        <aside class="sidebar glass">
            <div class="logo">EDU<span>SYNC</span></div>
            <nav class="side-nav">
                <button class="nav-btn active" data-page="overview-page">Overview</button>
                <button class="nav-btn" data-page="staff-page">Manage Staff</button>
                <button class="nav-btn" data-page="report-page">Global Reports</button>
                <button class="nav-btn" data-page="lookup-page">Student Lookup</button>
            </nav>
            <div class="sidebar-footer">
                <button id="admin-logout" class="logout-link">Sign Out</button>
            </div>
        </aside>

        <main class="admin-main">
            <!-- Overview Page -->
            <section id="overview-page" class="admin-page animate-up">
                <header>
                    <h1>System <span>Overview</span></h1>
                    <p id="admin-welcome"></p>
                </header>
                
                <div class="stats-row">
                    <div class="stat-card glass">
                        <span class="label">Active Staff</span>
                        <span class="value" id="count-staff">0</span>
                    </div>
                    <div class="stat-card glass">
                        <span class="label">Total Students</span>
                        <span class="value" id="count-students">0</span>
                    </div>
                    <div class="stat-card glass">
                        <span class="label">Classes</span>
                        <span class="value" id="count-classes">0</span>
                    </div>
                </div>
            </section>

            <!-- Staff Management Page -->
            <section id="staff-page" class="admin-page hidden animate-up">
                <header class="page-header">
                    <h1>Manage <span>Staff</span></h1>
                    <button class="add-btn" id="open-staff-modal">+ Add New Staff</button>
                </header>

                <div class="table-container glass">
                    <table id="staff-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="staff-list-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Global Reports Page -->
            <section id="report-page" class="admin-page hidden animate-up">
                <header>
                    <h1>Global <span>Audit Center</span></h1>
                    <p>Search and audit attendance records across the institution.</p>
                </header>
                
                <div class="control-grid glass">
                    <div class="field">
                        <label>Year</label>
                        <select id="adm-year-select"></select>
                    </div>
                    <div class="field">
                        <label>Department</label>
                        <select id="adm-dept-select"></select>
                    </div>
                    <div class="field">
                        <label>Target Date</label>
                        <input type="date" id="adm-date-select">
                    </div>
                    <div class="field">
                        <label>Subject</label>
                        <select id="adm-subject-select"></select>
                    </div>
                    <button id="adm-gen-report" class="primary-btn">Audit Records</button>
                </div>

                <div id="adm-report-result" class="hidden animate-up" style="margin-top: 20px;">
                    <!-- Results -->
                </div>
            </section>

            <!-- Student Lookup Page -->
            <section id="lookup-page" class="admin-page hidden animate-up">
                <header>
                    <h1>Student <span>Lookup</span></h1>
                    <p>Search for a specific student's attendance percentage.</p>
                </header>
                <div class="control-grid glass">
                    <div class="field">
                        <label>Register Number</label>
                        <input type="text" id="lookup-reg-no" placeholder="e.g., 71222403002" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; color: white; outline: none;">
                    </div>
                    <button id="lookup-btn" class="primary-btn" style="padding: 15px 30px;">Search</button>
                </div>

                <div id="lookup-result" class="hidden animate-up" style="margin-top: 20px;">
                    <!-- Results -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add Staff Modal -->
    <div id="staff-modal" class="modal hidden">
        <div class="modal-content glass animate-up">
            <h2>Add New Staff Member</h2>
            <div class="input-group">
                <input type="text" id="new-staff-name" placeholder="Full Name">
                <input type="email" id="new-staff-email" placeholder="Email Address">
                <div class="password-wrapper" style="position: relative; width: 100%;">
                    <input type="password" id="new-staff-pass" placeholder="Password" style="width: 100%;">
                    <button type="button" class="toggle-password" data-target="new-staff-pass" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem;">👁️</button>
                </div>
                <input type="text" id="new-staff-dept" placeholder="Department (e.g. CS)">
            </div>
            <div class="modal-actions">
                <button class="secondary-btn" id="close-staff-modal">Cancel</button>
                <button class="primary-btn" id="create-staff-btn">Create Account</button>
            </div>
        </div>
    </div>

    <div id="loader" class="loader-container hidden">
        <div class="spinner"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
