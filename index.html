<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Attendance Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav>
        <div class="logo">EDU<span>SYNC</span></div>
        <div class="nav-links">
            <a href="index.html" class="active">Student Portal</a>
            <a href="staff.html">Staff Portal</a>
        </div>
    </nav>

    <main>
        <section class="hero" id="search-section">
            <div class="hero-content">
                <h1 class="animate-up">Track Your <span>Progress.</span></h1>
                <p class="animate-up delay-1">Enter your registration number to view your real-time attendance analytics.</p>
                
                <div class="search-box animate-up delay-2">
                    <input type="text" id="reg-no" placeholder="Enter Registration No (e.g. 2024CS001)" autocomplete="off">
                    <button id="search-btn">View Stats</button>
                </div>
            </div>
        </section>

        <section class="dashboard hidden" id="dashboard-section">
            <div class="dashboard-grid">
                <!-- Percentage Card -->
                <div class="card glass animate-up">
                    <h3>Overall Attendance</h3>
                    <div class="progress-container">
                        <svg class="progress-ring" width="200" height="200">
                            <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" r="80" cx="100" cy="100"/>
                            <circle id="progress-circle" class="progress-ring__circle" stroke="url(#gradient)" stroke-width="12" stroke-linecap="round" fill="transparent" r="80" cx="100" cy="100"/>
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#8E2DE2" />
                                    <stop offset="100%" stop-color="#4A00E0" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="progress-text"><span id="percentage-val">0</span>%</div>
                    </div>
                </div>

                <!-- Stats Details -->
                <div class="stats-group">
                    <div class="card glass animate-up delay-1">
                        <div class="stat-icon present">✔</div>
                        <div class="stat-info">
                            <span class="label">Total Present</span>
                            <span class="value" id="present-val">0</span>
                        </div>
                    </div>
                    <div class="card glass animate-up delay-2">
                        <div class="stat-icon absent">✘</div>
                        <div class="stat-info">
                            <span class="label">Total Absent</span>
                            <span class="value" id="absent-val">0</span>
                        </div>
                    </div>
                    <div class="card glass animate-up delay-3">
                        <div class="stat-icon total">Σ</div>
                        <div class="stat-info">
                            <span class="label">Total Sessions</span>
                            <span class="value" id="total-val">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="back-btn animate-up delay-4" id="back-btn">← Search Different Student</button>
        </section>

        <div id="loader" class="loader-container hidden">
            <div class="spinner"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 EduSync Attendance Management. Designed for Excellence.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
